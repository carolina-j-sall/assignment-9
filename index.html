<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <title>Birthday party invite</title>
</head>
<body>
  <div class="form">
    <div class="form-content">
      <svg class="animate__animated animate__tada form-svg" width="28" height="52" viewBox="0 0 28 52" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="22.5" y1="27.1953" x2="2.5" y2="27.1953" stroke="#FF6DDF" stroke-width="5" stroke-linecap="round"/>
        <line x1="21.967" y1="14.1416" x2="11.3604" y2="3.535" stroke="#FFA8EC" stroke-width="5" stroke-linecap="round"/>
        <line x1="25.028" y1="38.7807" x2="14.4214" y2="49.3873" stroke="#FFA8EC" stroke-width="5" stroke-linecap="round"/>
      </svg>
      <h1 class="form-title">Birthday party invitation</h1>
      <svg class="animate__animated animate__tada form-svg-reverse" width="28" height="52" viewBox="0 0 28 52" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="2.5" y1="-2.5" x2="22.5" y2="-2.5" transform="matrix(1 8.74228e-08 8.74228e-08 -1 2.52795 24.6953)" stroke="#FF6DDF" stroke-width="5" stroke-linecap="round"/>
        <line x1="2.5" y1="-2.5" x2="17.5" y2="-2.5" transform="matrix(0.707107 -0.707107 -0.707107 -0.707107 2.02539 14.1416)" stroke="#FFA8EC" stroke-width="5" stroke-linecap="round"/>
        <line x1="2.5" y1="-2.5" x2="17.5" y2="-2.5" transform="matrix(0.707107 0.707107 0.707107 -0.707107 2.5 35.2451)" stroke="#FFA8EC" stroke-width="5" stroke-linecap="round"/>
      </svg>
      <p class="form-desc">It's my birthday on Friday the 18th of September and I want you to celebrate that with me&nbsp;🥳
        <br>Please let me know if you can attend or not.</p>
    </div>
    <form action="" class="form-structure">
      <label for="name" class="form-label">Your name</label>
      <input type="name" class="form-input" placeholder="Adrienne Anderson" id="name">
      <label for="email" class="form-label">Your email (required)</label>
      <input type="email" class="form-input" placeholder="adrienne@hey.com" id="email" required>
      <label for="dropdown" class="form-label">RSVP</label>
      <select type="dropdown" class="form-input form-dropdown" placeholder="Yes" id="dropdown"> 
        <option value="Yes">Yes</option>
        <option value="Maybe">Maybe</option>
        <option value="No">No</option>
      </select>
      <label for="text" class="form-label">Do you want to add something else?</label>
      <textarea name="comment" class="form-comment" placeholder="I vote that we only eat food from Vietnam from now on.." id="comment"></textarea>
      <button class="form-submit">RSVP&nbsp;
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="10" cy="10" r="9.5" stroke="black"/>
          <path d="M16.5 10C16.5 13.5899 13.5899 16.5 10 16.5C6.41015 16.5 3.5 13.5899 3.5 10" stroke="black" stroke-linecap="round"/>
          <path d="M7 4C6.68612 4 6.32271 4.20856 6.01172 4.71387C5.70569 5.21116 5.5 5.92984 5.5 6.75C5.5 7.57016 5.70569 8.28884 6.01172 8.78613C6.32271 9.29144 6.68612 9.5 7 9.5C7.31388 9.5 7.67729 9.29144 7.98828 8.78613C8.29431 8.28884 8.5 7.57016 8.5 6.75C8.5 5.92984 8.29431 5.21116 7.98828 4.71387C7.67729 4.20856 7.31388 4 7 4Z" stroke="black"/>
          <path d="M13 4C12.6861 4 12.3227 4.20856 12.0117 4.71387C11.7057 5.21116 11.5 5.92984 11.5 6.75C11.5 7.57016 11.7057 8.28884 12.0117 8.78613C12.3227 9.29144 12.6861 9.5 13 9.5C13.3139 9.5 13.6773 9.29144 13.9883 8.78613C14.2943 8.28884 14.5 7.57016 14.5 6.75C14.5 5.92984 14.2943 5.21116 13.9883 4.71387C13.6773 4.20856 13.3139 4 13 4Z" stroke="black"/>
        </svg>
      </button>
    </form>
  </div>
</body>
</html>
